<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración | Rutas</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        /* Estilos del Dashboard Admin */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        /* Navbar estilo Administrador */
        .admin-header {
            background-color: #1a1a2e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .badge-admin {
            background-color: #e63946;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Contenedor Principal */
        .dashboard-container {
            padding: 20px;
            text-align: center;
        }

        /* Panel de Controles */
        #panel-busqueda {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
            border-top: 4px solid #1a1a2e;
        }

        #panel-busqueda label {
            font-weight: 600;
            color: #333;
            margin-right: 10px;
        }

        input[type="number"] {
            padding: 10px;
            font-size: 16px;
            width: 150px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #1a1a2e;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1a1a2e;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #5652aa;
        }

        /* Estilos del Mapa y Estado */
        #miMapa {
            height: 550px;
            width: 85%;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            z-index: 1; /* Para que Leaflet no cubra modales */
        }

        #estado {
            background-color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            color: gray;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>

<!-- HEADER DEL ADMIN -->
<header class="admin-header">
    <h1 id="titulo-mapa">Monitoreo</h1>
    <span class="badge-admin">ACCESO RESTRINGIDO - MÓDULO ADMIN</span>
</header>

<div class="dashboard-container">
    <!-- CONTROLES -->
    <div id="panel-busqueda">
        <label for="inputRepartidorId">Seleccione Repartidor Activo (ID):</label>
        <input type="number" id="inputRepartidorId" placeholder="Ej. 5">
        <button onclick="buscarRepartidor()">Inspeccionar ruta</button>
    </div>

    <div>
        <p id="estado">Esperando conexión segura con el servidor...</p>
    </div>

    <!-- MAPA LEAFLET -->
    <div id="miMapa"></div>
</div>

<script>
    var mapa = L.map('miMapa').setView([19.5443, -98.8796], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(mapa);

    var marcadorRepartidor = null;
    var coloresLatido = ['#1a1a2e', '#081c63', '#457b9d'];
    var indiceColor = 0;

    var socket = new SockJS('/ws-tracking-sockjs');
    var stompClient = Stomp.over(socket);

    var suscripcionActual = null;
    var idActivo = "";

    stompClient.connect({}, function (frame) {
        document.getElementById('estado').innerText = "Servidor conectado. Ingresa un ID para rastrear.";
        document.getElementById('estado').style.color = "green";
    }, function(error) {
        document.getElementById('estado').innerText = "Error de conexión con el servidor";
        document.getElementById('estado').style.color = "red";
    });

    // Función principal de busqueda y validación
    function buscarRepartidor() {
        var nuevoId = document.getElementById('inputRepartidorId').value.trim();

        if (!nuevoId) {
            alert("Por favor ingresa un ID válido");
            return;
        }

        if (!stompClient || !stompClient.connected) {
            alert("El servidor aún no está conectado. Espera un momento.");
            return;
        }

        document.getElementById('estado').innerText = "Verificando credenciales del Repartidor " + nuevoId + "...";
        document.getElementById('estado').style.color = "gray";

        // Hacemos la consulta HTTP al servidor
        fetch('/api/repartidores/' + nuevoId)
            .then(response => {
                if (response.ok) {
                    // código 200 = Si existe, procedemos a suscribirnos al mapa
                    iniciarSuscripcionMapa(nuevoId);
                } else {
                    // código 404 (o similar): No existe, se bloquea la acción
                    document.getElementById('estado').innerText = "Acceso Denegado: Repartidor " + nuevoId + " no autorizado o inexistente.";
                    document.getElementById('estado').style.color = "red";
                    document.getElementById('titulo-mapa').innerText = "Monitoreo";

                }
            })
            .catch(error => {
                document.getElementById('estado').innerText = "Error de red al intentar contactar la base de datos.";
                document.getElementById('estado').style.color = "red";
            });
    }

    // Función secundaria, se ejecute solo si el ID fue validado
    function iniciarSuscripcionMapa(nuevoId) {
        if (suscripcionActual !== null) {
            suscripcionActual.unsubscribe();
        }

        idActivo = nuevoId;

        document.getElementById('titulo-mapa').innerText = "Auditoría en Vivo - Repartidor " + idActivo;
        document.getElementById('estado').innerText = "Conexión establecida. Interceptando señal del repartidor " + idActivo + "...";
        document.getElementById('estado').style.color = "green";

        // Nos suscribimos al nuevo canal
        suscripcionActual = stompClient.subscribe('/topic/repartidor/' + idActivo, function (mensaje) {
            var ubicacion = JSON.parse(mensaje.body);
            var lat = ubicacion.latitud;
            var lon = ubicacion.longitud;

            var colorElegido = coloresLatido[indiceColor];
            document.getElementById('estado').innerText = "Transmisión Activa | Lat: " + lat + ", Lon: " + lon;
            document.getElementById('estado').style.color = colorElegido;
            indiceColor = (indiceColor + 1) % coloresLatido.length;

            if (marcadorRepartidor === null) {
                marcadorRepartidor = L.marker([lat, lon]).addTo(mapa);
            } else {
                marcadorRepartidor.setLatLng([lat, lon]);
            }

            mapa.panTo([lat, lon]);
            marcadorRepartidor.bindPopup("<b>UNIDAD " + idActivo + "</b><br>Lat: " + lat + "<br>Lon: " + lon).openPopup();
        });
    }
</script>

</body>
</html>
