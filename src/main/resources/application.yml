spring:
  application:
    name: sistema-rm-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sistema_rm
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rm_dev_local}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

stripe:
  secret-key: tu_secret_key
  webhook-secret: tu_webhook_secret_key 
  default-currency: mxn