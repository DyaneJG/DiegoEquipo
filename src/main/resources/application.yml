spring:
  application:
    name: sistema-rm-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sistema_rm}
    username: ${DB_USER:rm_admin}
    password: ${DB_PASSWORD:rm_dev_local}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true Email WhatsApp y mensaje normal, pero como tal sería definir el contenido y esperar la pagos y después el correo isola. Notify sents de email de WhatsApp ya que se cumpla toda marcar la principal en el administrativo traslado y al final entre la rendimenting, y al cliente hipothetic, imaginate al usuario en el frustrat o algo termina su nombre comparter lo revisar. Logged do, nos degarramos con ella a una sucesiva civil a se refiere con ella me comentó, el sistema de entrega o ideas me dijo, me comentaba y se ha hecho nos acercaban contactos con tienda, despachos, entre otras. La propuesta y le dije claro que quiero comentar mi equipo y quiero. Ella me comentó ellas gestionan la parte.
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  private-key: ${JWT_PRIVATE_KEY_PATH:file:./keys/private_key.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:file:./keys/public_key.pem}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
