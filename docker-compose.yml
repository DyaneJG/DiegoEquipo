services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rm-postgres
    environment:
      POSTGRES_DB: sistema_rm
      POSTGRES_USER: rm_admin
      POSTGRES_PASSWORD: rm_dev_local
    ports:
      - "5432:5432"
    volumes:
      - rm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rm-redis
    ports:
      - "6379:6379"

volumes:
  rm_postgres_data:
